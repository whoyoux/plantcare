name: Release

# Tag a commit on main (`git tag v1.2.3 && git push --tags`) to deploy the API and website to prod.
on:
  push:
    tags: ['v*']

jobs:
  deploy-prod:
    name: Deploy prod
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      stage: prod
    secrets: inherit
