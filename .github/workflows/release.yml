name: Release

# Tag a commit on main (`git tag v1.2.3 && git push --tags`) to deploy the API and website to prod.
# The tagged commit is checked again first; the prod environment then waits for approval.
on:
  push:
    tags: ['v*']

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-prod:
    name: Deploy prod
    needs: checks
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      stage: prod
    secrets: inherit
