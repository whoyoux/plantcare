packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

catalog:
  # One React for the whole repo: React Native 0.88 (Expo SDK 58) pins 19.3.0, and a second copy
  # (pulled in through react-dom) would end up next to it in the app's native build.
  react: 19.3.0
  react-dom: 19.3.0
  turbo: ^2.11.8
  # Expo SDK 58 pins TypeScript 6.x; keep the whole repo on the same version.
  typescript: ~6.0.3
  zod: ^4.6.7
  # Alchemy v2 applies migrations only in drizzle-kit's v1 layout; keep both on its pinned RC.
  drizzle-orm: 1.0.0-rc.5-ab785fc
  drizzle-kit: 1.0.0-rc.5-ab785fc
  postgres: ^3.4.9
  better-auth: ^1.7.7
  hono: ^4.13.13
  '@cloudflare/workers-types': ^5.0.0
  # eslint-config-expo's react/import plugins support ESLint up to 9.
  eslint: ^9.39.0
  '@eslint/js': ^9.39.0
  typescript-eslint: ^8.71.0
  eslint-config-prettier: ^10.1.8
  globals: ^16.0.0
  prettier: ^3.9.0
  vitest: ^5.0.4

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10 || 58.1.11'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - '@expo/ui@58.0.19'
  - babel-preset-expo@58.0.16
  - effect@4.0.5
  - expo@58.0.12 || 58.0.14
  - expo-asset@58.0.16
  - expo-glass-effect@58.0.4
  - expo-image@58.0.15
  - expo-modules-core@58.0.20 || 58.0.22
  - expo-modules-jsi@58.0.14 || 58.0.15
  - expo-router@58.0.21 || 58.0.23
  - expo-system-ui@58.0.6
  - expo-updates@58.0.17
  - react-native-nitro-fetch@1.9.0
  - '@expo/schema-utils@58.0.2'
  - expo-build-properties@58.0.11
  - expo-dev-client@58.0.14
  - expo-dev-launcher@58.0.14

# Expo's web packages auto-install react-dom as a peer; without this pnpm picks the newest one,
# which drags a second React into the app's native build.
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
