packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

catalog:
  turbo: ^2.11.8
  # Expo SDK 57 pins TypeScript 6.x; keep the whole repo on the same version.
  typescript: ~6.0.3
  zod: ^4.6.7
  # Alchemy v2 applies migrations only in drizzle-kit's v1 layout; keep both on its pinned RC.
  drizzle-orm: 1.0.0-rc.5-ab785fc
  drizzle-kit: 1.0.0-rc.5-ab785fc
  postgres: ^3.4.9
  better-auth: ^1.7.7
  hono: ^4.13.0
  '@cloudflare/workers-types': ^5.0.0
  # eslint-config-expo's react/import plugins support ESLint up to 9.
  eslint: ^9.39.0
  '@eslint/js': ^9.39.0
  typescript-eslint: ^8.71.0
  eslint-config-prettier: ^10.1.8
  globals: ^16.0.0
  prettier: ^3.9.0

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/ui@57.0.24'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-router@57.0.27
  - expo@57.0.29
  - effect@4.0.5
